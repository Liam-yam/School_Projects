<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Projects – Liam Mathew Palomo</title>
    <meta name="description" content="School web development projects by Liam Mathew Palomo.">
    <link rel="icon" type="image/png" href="https://liam-yam.github.io/assets/logo.png">

    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("theme"); } catch (e) { }
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        [data-bs-theme="light"] {
            --bs-body-bg: #f7f6f3;
            --bs-body-bg-rgb: 247, 246, 243;
            --bs-tertiary-bg: #fcfbf9;
            --bs-tertiary-bg-rgb: 252, 251, 249;
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #0f0f10;
            --bs-body-bg-rgb: 15, 15, 16;
            --bs-tertiary-bg: #181819;
            --bs-tertiary-bg-rgb: 24, 24, 25;
        }

        [data-bs-theme="light"] .logo {
            filter: brightness(0.28);
        }

        .font-serif {
            font-family: "Instrument Serif", Georgia, serif;
            font-weight: 400;
        }

        .page-heading {
            font-size: clamp(2.75rem, 6.4vw, 5rem);
            letter-spacing: -0.03em;
        }

        .project-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--bs-box-shadow) !important;
        }

        .preview iframe {
            width: 1280px;
            height: 800px;
            transform-origin: top left;
            pointer-events: none;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar sticky-top bg-body border-bottom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fs-6 fw-semibold" href="https://liam-yam.github.io">
                <span class="border rounded-3 bg-body-tertiary p-1 lh-1"><img src="https://liam-yam.github.io/assets/logo.png"
                        alt="" width="26" height="26" class="logo"></span>
                <span class="d-none d-sm-inline">Liam Mathew Palomo</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary rounded-circle" type="button" id="themeToggle"></button>
                <a href="https://liam-yam.github.io/#projects" class="btn btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-arrow-left"></i> Portfolio
                </a>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 py-5">
        <header class="d-flex flex-wrap justify-content-between align-items-end gap-4 pb-4 mb-5 border-bottom">
            <div>
                <p class="small text-uppercase fw-medium text-body-secondary mb-3">School Projects</p>
                <h1 class="page-heading font-serif lh-1 mb-0">Web Dev <em class="text-body-secondary">Projects</em></h1>
                <p class="lead text-body-secondary mt-3 mb-0" style="max-width: 36rem">Activities and exercises from my
                    web development class. Click a project to open the live page.</p>
            </div>
            <div class="d-flex align-items-center gap-3 border rounded-4 bg-body-tertiary shadow-sm p-3 pe-4">
                <span class="rounded-3 bg-body-secondary fs-5 px-3 py-2"><i class="bi bi-code-slash"></i></span>
                <div>
                    <p class="font-serif display-5 lh-1 mb-0" id="projectCount">0</p>
                    <p class="small text-uppercase fw-medium text-body-secondary mb-0">Projects</p>
                </div>
            </div>
        </header>

        <div class="row g-4" id="gallery"></div>
    </main>

    <footer class="border-top py-4 small text-body-secondary">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>© <span id="year">2026</span> Liam Mathew Palomo. All rights reserved.</span>
            <a href="https://github.com/Liam-yam/School_Projects" class="link-secondary" target="_blank"
                rel="noopener">View source on GitHub</a>
        </div>
    </footer>

    <script>
        const projects = [
            { title: "ATY_01", description: "My Daily Overview — a bento-style dashboard with a clock, music player and weather.", path: "ATY_01/index.html", tags: ["HTML", "Bootstrap"] },
            { title: "ATY_02", description: "Lotus — a shoe store page built from arrays of objects and for loops.", path: "ATY_02/index.html", tags: ["HTML", "Bootstrap", "JavaScript"] },
            { title: "MT_01", description: "Valogall — a Valorant gallery of agents, maps, guns, skins, sprays and tiers, powered by a public API.", path: "MT_01/index.html", tags: ["HTML", "Bootstrap", "JavaScript", "API"] }
        ];

        document.getElementById("gallery").innerHTML = projects.map((p, i) => `
            <div class="col-12 col-sm-6 col-lg-4">
                <a href="${p.path}" class="card project-card h-100 rounded-4 overflow-hidden shadow-sm bg-body-tertiary text-decoration-none">
                    <div class="preview position-relative overflow-hidden border-bottom bg-body-secondary" style="aspect-ratio: 16 / 10">
                        <iframe src="${p.path}" title="${p.title} preview" loading="lazy" tabindex="-1" aria-hidden="true" class="border-0"></iframe>
                        <span class="badge rounded-pill text-bg-dark position-absolute top-0 start-0 m-3">${String(i + 1).padStart(2, "0")}</span>
                    </div>
                    <div class="card-body d-flex flex-column p-4">
                        <h2 class="h5 fw-semibold">${p.title}</h2>
                        <p class="small text-body-secondary">${p.description}</p>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            ${p.tags.map(t => `<span class="badge rounded-pill border bg-body-secondary text-body-secondary fw-medium px-3 py-2">${t}</span>`).join("")}
                        </div>
                        <span class="d-flex justify-content-between mt-auto pt-3 border-top small fw-medium text-body">Open project <i class="bi bi-arrow-up-right"></i></span>
                    </div>
                </a>
            </div>`).join("");

        document.getElementById("projectCount").textContent = String(projects.length).padStart(2, "0");
        document.getElementById("year").textContent = new Date().getFullYear();

        function fitPreviews() {
            document.querySelectorAll(".preview").forEach(box => {
                box.querySelector("iframe").style.transform = `scale(${box.clientWidth / 1280})`;
            });
        }
        window.addEventListener("resize", fitPreviews);
        fitPreviews();

        const root = document.documentElement;
        const toggle = document.getElementById("themeToggle");
        function applyTheme(theme) {
            root.setAttribute("data-bs-theme", theme);
            toggle.innerHTML = `<i class="bi bi-${theme === "dark" ? "sun" : "moon-stars"}"></i>`;
            toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        }
        applyTheme(root.getAttribute("data-bs-theme"));
        toggle.addEventListener("click", () => {
            const next = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
            applyTheme(next);
            try { localStorage.setItem("theme", next); } catch (e) { }
        });
    </script>
</body>

</html>
