<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Projects – Liam Mathew Palomo</title>
    <meta name="description" content="School web development projects by Liam Mathew Palomo.">
    <link rel="icon" type="image/png" href="https://liam-yam.github.io/assets/logo.png">

    <script>
        (function () {
            document.documentElement.classList.add('js');
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root,
        :root[data-theme="light"] {
            --bg: #f7f6f3;
            --surface: #fcfbf9;
            --surface-2: #f1f0ec;
            --border: rgba(27, 27, 26, 0.1);
            --border-strong: rgba(27, 27, 26, 0.22);
            --text: #1b1b1a;
            --text-2: #5c5b57;
            --text-3: #76756f;
            --shadow-sm: 0 1px 2px rgba(27, 27, 26, 0.05);
            --shadow-md: 0 1px 2px rgba(27, 27, 26, 0.04), 0 14px 34px rgba(27, 27, 26, 0.08);
            --nav-bg: rgba(247, 246, 243, 0.82);
            --logo-filter: brightness(0.28);
            --glow: rgba(120, 108, 88, 0.16);
            --deco: rgba(27, 27, 26, 0.34);
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            --bg: #0f0f10;
            --surface: #181819;
            --surface-2: #1f1f21;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.2);
            --text: #ececea;
            --text-2: #a5a4a0;
            --text-3: #7d7c78;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px rgba(0, 0, 0, 0.45);
            --nav-bg: rgba(15, 15, 16, 0.8);
            --logo-filter: none;
            --glow: rgba(255, 255, 255, 0.045);
            --deco: rgba(255, 255, 255, 0.2);
            color-scheme: dark;
        }

        :root {
            --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
            --radius: 16px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --bs-body-font-family: var(--font-sans);
            --bs-body-bg: var(--bg);
            --bs-body-color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        ::selection { background: var(--text); color: var(--bg); }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

        /* Nav */
        .navbar {
            background: var(--nav-bg);
            -webkit-backdrop-filter: saturate(160%) blur(18px);
            backdrop-filter: saturate(160%) blur(18px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }
        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            padding: 0;
        }
        .logo-wrap {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .logo-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            filter: var(--logo-filter);
            transition: transform 0.35s var(--ease);
        }
        .navbar-brand:hover .logo-img { transform: scale(1.1); }
        .logo-name {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .nav-actions { display: flex; align-items: center; gap: 10px; }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-2);
            font-size: 1.0625rem;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, transform 0.2s;
        }
        .icon-btn:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }
        .theme-toggle .icon-sun,
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

        .btn {
            --bs-btn-font-size: 0.9375rem;
            --bs-btn-font-weight: 500;
            --bs-btn-padding-x: 1.5rem;
            --bs-btn-padding-y: 0.75rem;
            --bs-btn-border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.2s var(--ease);
        }
        .btn.btn-sm { --bs-btn-padding-x: 1.125rem; --bs-btn-padding-y: 0.5rem; --bs-btn-font-size: 0.875rem; }
        .btn-ghost {
            --bs-btn-color: var(--text);
            --bs-btn-bg: transparent;
            --bs-btn-border-color: var(--border-strong);
            --bs-btn-hover-color: var(--text);
            --bs-btn-hover-bg: var(--surface-2);
            --bs-btn-hover-border-color: var(--text-3);
            --bs-btn-active-color: var(--text);
            --bs-btn-active-bg: var(--surface-2);
            --bs-btn-active-border-color: var(--text-3);
        }
        .btn-ghost .bi-arrow-left { transition: transform 0.25s var(--ease); }
        .btn-ghost:hover .bi-arrow-left { transform: translateX(-3px); }

        /* Hero / section */
        .gallery {
            position: relative;
            flex: 1;
            padding: clamp(64px, 9vw, 112px) 0 clamp(80px, 10vw, 128px);
            overflow: clip;
        }
        .gallery::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, var(--deco) 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-mask-image: radial-gradient(ellipse 65% 55% at 80% 15%, #000 15%, transparent 100%);
            mask-image: radial-gradient(ellipse 65% 55% at 80% 15%, #000 15%, transparent 100%);
            pointer-events: none;
        }
        .gallery::after {
            content: "";
            position: absolute;
            left: 15%;
            top: 30%;
            width: min(900px, 120vw);
            height: 620px;
            transform: translate(-50%, -50%);
            background: radial-gradient(closest-side, var(--glow), transparent);
            pointer-events: none;
        }
        .gallery > .container { position: relative; z-index: 1; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-2);
        }
        .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--text-3); }

        .page-heading {
            margin-bottom: 0;
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2.75rem, 6.4vw, 5rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            text-wrap: balance;
        }
        .page-heading em { color: var(--text-2); }

        .lead-text {
            max-width: 52ch;
            margin: 20px 0 0;
            font-size: 1.0625rem;
            line-height: 1.75;
            color: var(--text-2);
        }

        .head-split {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            margin-bottom: clamp(40px, 5vw, 64px);
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 22px 16px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }
        .stat-icon {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--surface-2);
            font-size: 1.25rem;
        }
        .stat-number {
            margin: 0;
            font-family: var(--font-serif);
            font-size: 2.5rem;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .stat-label {
            margin: 4px 0 0;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        /* Project cards */
        .project-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.35s var(--ease), box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .project-card:hover {
            color: var(--text);
            transform: translateY(-4px);
            border-color: var(--border-strong);
            box-shadow: var(--shadow-md);
        }

        .preview {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }
        .preview iframe {
            width: 1280px;
            height: 800px;
            border: 0;
            transform-origin: top left;
            pointer-events: none;
        }
        .preview-inner { transition: transform 0.6s var(--ease); transform-origin: center; }
        .project-card:hover .preview-inner { transform: scale(1.04); }
        .preview-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .project-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 24px;
        }
        .project-body h2 {
            margin-bottom: 8px;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .project-body p {
            margin-bottom: 18px;
            font-size: 0.9375rem;
            line-height: 1.65;
            color: var(--text-2);
        }
        .tag {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-2);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-2);
        }
        .project-open {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 500;
        }
        .project-open i { transition: transform 0.25s var(--ease); }
        .project-card:hover .project-open i { transform: translate(3px, -3px); }

        .site-footer {
            padding: 32px 0;
            border-top: 1px solid var(--border);
            font-size: 0.8125rem;
            color: var(--text-3);
        }
        .site-footer .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
        }
        .site-footer p { margin: 0; }
        .site-footer a { color: var(--text-2); }
        .site-footer a:hover { color: var(--text); }

        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
        .reveal.visible { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>
    <nav class="navbar sticky-top" aria-label="Primary">
        <div class="container">
            <a class="navbar-brand" href="https://liam-yam.github.io" aria-label="Liam Mathew Palomo, portfolio home">
                <span class="logo-wrap"><img src="https://liam-yam.github.io/assets/logo.png" alt="" class="logo-img"></span>
                <span class="logo-name d-none d-sm-inline">Liam Mathew Palomo</span>
            </a>
            <div class="nav-actions">
                <button class="icon-btn theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark mode">
                    <i class="bi bi-moon-stars icon-moon" aria-hidden="true"></i>
                    <i class="bi bi-sun icon-sun" aria-hidden="true"></i>
                </button>
                <a href="https://liam-yam.github.io/#projects" class="btn btn-ghost btn-sm">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Portfolio
                </a>
            </div>
        </div>
    </nav>

    <main class="gallery">
        <div class="container">
            <header class="head-split reveal">
                <div>
                    <p class="eyebrow">School Projects</p>
                    <h1 class="page-heading">Web Dev <em>Projects</em></h1>
                    <p class="lead-text">Activities and exercises from my web development class. Click a project to open the live page.</p>
                </div>
                <div class="stat">
                    <span class="stat-icon"><i class="bi bi-code-slash" aria-hidden="true"></i></span>
                    <div>
                        <p class="stat-number" id="projectCount">0</p>
                        <p class="stat-label">Projects</p>
                    </div>
                </div>
            </header>

            <div class="row g-4" id="gallery"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year">2026</span> Liam Mathew Palomo. All rights reserved.</p>
            <p><a href="https://github.com/Liam-yam/School_Projects" target="_blank" rel="noopener">View source on GitHub</a></p>
        </div>
    </footer>

    <script>
        // Add new projects here.
        const projects = [
            { title: "ATY_01", description: "My Daily Overview — a bento-style dashboard with a clock, music player and weather.", path: "ATY_01/index.html", tags: ["HTML", "Bootstrap"] }
        ];

        const gallery = document.getElementById("gallery");

        projects.forEach(({ title, description, path, tags = [] }, i) => {
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-lg-4 reveal";
            col.innerHTML = `
                <a href="${path}" class="project-card">
                    <div class="preview">
                        <div class="preview-inner">
                            <iframe src="${path}" title="${title} preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
                        </div>
                        <span class="preview-badge">${String(i + 1).padStart(2, "0")}</span>
                    </div>
                    <div class="project-body">
                        <h2>${title}</h2>
                        <p>${description}</p>
                        <div class="d-flex flex-wrap gap-2 mb-3">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                        <span class="project-open">Open project <i class="bi bi-arrow-up-right" aria-hidden="true"></i></span>
                    </div>
                </a>`;
            gallery.appendChild(col);
        });

        document.getElementById("projectCount").textContent = String(projects.length).padStart(2, "0");
        document.getElementById("year").textContent = new Date().getFullYear();

        function fitPreviews() {
            document.querySelectorAll(".preview").forEach(box => {
                box.querySelector("iframe").style.transform = `scale(${box.clientWidth / 1280})`;
            });
        }
        window.addEventListener("resize", fitPreviews);
        fitPreviews();

        // Theme toggle (shares the "theme" setting with the portfolio)
        const root = document.documentElement;
        const toggle = document.getElementById("themeToggle");
        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            root.setAttribute("data-bs-theme", theme);
            toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        }
        applyTheme(root.getAttribute("data-theme") || "light");
        toggle.addEventListener("click", () => {
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(next);
            try { localStorage.setItem("theme", next); } catch (e) {}
        });

        // Fade-in on scroll
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("visible");
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll(".reveal").forEach((el, i) => {
            el.style.transitionDelay = `${Math.min(i, 6) * 60}ms`;
            observer.observe(el);
        });
    </script>
</body>

</html>
