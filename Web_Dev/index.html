<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Project Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        .preview {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #fff;
        }

        .preview iframe {
            width: 1280px;
            height: 800px;
            border: 0;
            transform-origin: top left;
            pointer-events: none;
        }

        .gallery-card {
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 .75rem 1.5rem rgba(0, 0, 0, .4) !important;
        }
    </style>
</head>

<body class="bg-dark text-light">
    <main class="container py-5">
        <header class="mb-5">
            <h1 class="fw-semibold">Web Dev Projects</h1>
            <p class="text-secondary mb-0">Click a project to open it.</p>
        </header>

        <div class="row g-4" id="gallery"></div>
    </main>

    <script>
        
        const projects = [
            { title: "ATY_01", description: "My Daily Overview", path: "ATY_01/index.html" }
        ];

        const gallery = document.getElementById("gallery");

        projects.forEach(({ title, description, path }) => {
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-lg-4";
            col.innerHTML = `
                <a href="${path}" class="card gallery-card h-100 bg-black border-secondary text-decoration-none text-light shadow">
                    <div class="preview">
                        <iframe src="${path}" title="${title} preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe>
                    </div>
                    <div class="card-body">
                        <h2 class="h5 mb-1">${title}</h2>
                        <p class="text-secondary small mb-0">${description}</p>
                    </div>
                </a>`;
            gallery.appendChild(col);
        });

        
        function fitPreviews() {
            document.querySelectorAll(".preview").forEach(box => {
                box.querySelector("iframe").style.transform = `scale(${box.clientWidth / 1280})`;
            });
        }
        window.addEventListener("resize", fitPreviews);
        fitPreviews();
    </script>
</body>

</html>
