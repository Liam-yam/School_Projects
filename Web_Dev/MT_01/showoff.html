<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall | Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .bg-text { font-size: 17vw; line-height: 1; }
    .plain-text { font-family: var(--bs-font-sans-serif); }
    .spaced-text { letter-spacing: .4em; }
    @media (min-width: 992px) { .portrait { height: calc(100vh - 178px); } }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <div class="bg-text position-fixed top-50 start-50 translate-middle mt-4 text-danger text-nowrap opacity-25 pe-none user-select-none z-n1">VALORANT</div>
  <img class="position-fixed bottom-0 start-0 m-4 pe-none z-n1" src="assets/riot-logo.png" alt="Riot Games" width="130">

  <nav class="navbar sticky-top border-bottom border-danger border-2" style="background-color: #151c28;">
    <div class="container">
      <a class="navbar-brand fs-3 text-danger" href="index.html">VALOGALL</a>
      <form action="agents.html">
        <input class="form-control rounded-pill" type="search" name="search" placeholder="Search agents">
      </form>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a id="back" href="agents.html" class="btn btn-outline-light rounded-pill px-3" title="Back to agents">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <span class="badge text-bg-danger rounded-pill fs-5 px-4 py-2">Agents</span>
    </div>

    <div class="row align-items-start g-4" id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elBack = document.getElementById("back");
    var elLoader = document.getElementById("loader");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var id = urlParams.get('id');
    var page = urlParams.get('page');
    var role = urlParams.get('role');

    if (page != null && role != null) {
      elBack.href = 'agents.html?page=' + page + '&role=' + role;
    }

    var keys = ['C', 'Q', 'E', 'X'];
    var slots = ['Grenade', 'Ability1', 'Ability2', 'Ultimate'];
    var tabs = [];
    var selectedTab = 0;
    var roleTitle = '';
    var roleText = '';

    const getAgent = async () => {
      try {
        const response = await fetch('https://valorant-api.com/v1/agents/' + id);
        const json = await response.json();
        var agent = json.data;

        var name = agent.displayName;
        var roleName = agent.role.displayName;
        var portrait = agent.fullPortrait;
        var background = agent.background;
        var color1 = '#' + agent.backgroundGradientColors[0];
        var color2 = '#' + agent.backgroundGradientColors[1];
        var abilities = agent.abilities;

        roleTitle = roleName;
        roleText = agent.role.description;

        tabs.push({ key: 'Info', title: 'Info', icon: agent.role.displayIcon, text: agent.description });

        for (var s = 0; s < slots.length; s++) {
          for (var a = 0; a < abilities.length; a++) {
            if (abilities[a].slot == slots[s]) {
              tabs.push({ key: keys[s], title: abilities[a].displayName, icon: abilities[a].displayIcon, text: abilities[a].description });
            }
          }
        }

        document.title = 'Valogall | ' + name;

        elParent.innerHTML = `
          <div class="col-lg-7">
            <div class="portrait rounded-4 shadow-lg overflow-hidden"
              style="background: url(`+background+`) center / cover no-repeat, linear-gradient(160deg, `+color1+`, `+color2+`);">
              <img class="w-100 h-100 object-fit-cover" src="`+portrait+`" alt="`+name+`">
            </div>
          </div>
          <div class="col-lg-5">
            <div class="bg-dark bg-gradient rounded-4 shadow-lg p-4">
              <div class="spaced-text text-body-secondary">`+roleName+`</div>
              <h1 class="display-4 text-white mb-4">`+name+`</h1>
              <div class="row g-2 text-center mb-4" id="tabs"></div>
              <h4 class="text-white" id="tabTitle"></h4>
              <p class="plain-text mb-0" id="tabText"></p>
              <div id="roleInfo"></div>
            </div>
          </div>
        `;

        renderTabs();
      } catch (error) {
        elParent.innerHTML = `<div class="col-12"><div class="alert alert-danger text-center">Failed to load this agent. Please go back and try again.</div></div>`;
      }
      elLoader.classList.add('d-none');
    }

    function renderTabs() {
      var html = '';
      for (var i = 0; i < tabs.length; i++) {
        var key = tabs[i].key;
        var icon = tabs[i].icon;
        var title = tabs[i].title;

        var active = '';
        if (i == selectedTab) {
          active = 'active';
        }

        html += `
          <div class="col">
            <button class="btn btn-outline-danger `+active+` w-100 h-100 px-1" onclick="setTab(`+i+`)">
              <div class="mb-1">`+key+`</div>
              <img src="`+icon+`" alt="`+title+`" width="40">
            </button>
          </div>
        `;
      }
      document.getElementById("tabs").innerHTML = html;
      document.getElementById("tabTitle").innerHTML = tabs[selectedTab].title;
      document.getElementById("tabText").innerHTML = tabs[selectedTab].text;

      var roleHtml = '';
      if (selectedTab == 0) {
        roleHtml = `
          <h4 class="text-white mt-4">`+roleTitle+`</h4>
          <p class="plain-text mb-0">`+roleText+`</p>
        `;
      }
      document.getElementById("roleInfo").innerHTML = roleHtml;
    }

    function setTab(index) {
      selectedTab = index;
      renderTabs();
    }

    getAgent();
  </script>
</body>

</html>
