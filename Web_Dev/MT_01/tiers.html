<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall | Tiers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .bg-text { font-size: 17vw; line-height: 1; }
    .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
    .hover-lift:hover, .hover-lift:focus-within { transform: translateY(-.25rem); box-shadow: var(--bs-box-shadow-lg); }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <div class="bg-text position-fixed top-50 start-50 translate-middle mt-4 text-danger text-nowrap opacity-25 pe-none user-select-none z-n1">VALORANT</div>
  <img class="position-fixed bottom-0 start-0 m-4 pe-none z-n1" src="assets/riot-logo.png" alt="Riot Games" width="130">

  <nav class="navbar sticky-top border-bottom border-danger border-2" style="background-color: #151c28;">
    <div class="container">
      <a class="navbar-brand fs-3 text-danger" href="index.html">VALOGALL</a>
      <input id="search" class="form-control rounded-pill w-auto" type="search" placeholder="Search tiers" oninput="searchItems()">
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="index.html" class="btn btn-outline-light rounded-pill px-3" title="Back to home">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <span class="badge text-bg-danger rounded-pill fs-5 px-4 py-2">Tiers</span>
    </div>

    <div id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elSearch = document.getElementById("search");
    var elLoader = document.getElementById("loader");

    var ranks = [];
    var divisions = [];
    var radiant = null;
    var levels = [3, 2, 1];
    var search = '';

    const getTiers = async () => {
      try {
        const response = await fetch('https://valorant-api.com/v1/competitivetiers');
        const json = await response.json();
        var episodes = json.data;
        var latest = episodes[episodes.length - 1];

        for (var i = 0; i < latest.tiers.length; i++) {
          var tier = latest.tiers[i];
          var division = tier.divisionName;

          if (tier.tier >= 3) {
            ranks.push(tier);

            if (division == 'RADIANT') {
              radiant = tier;
            } else if (divisions.includes(division) == false) {
              divisions.push(division);
            }
          }
        }

        render();
      } catch (error) {
        elParent.innerHTML = `<div class="alert alert-danger text-center">Failed to load tiers. Please check your connection and try again.</div>`;
      }
      elLoader.classList.add('d-none');
    }

    function getRank(tierName) {
      for (var i = 0; i < ranks.length; i++) {
        if (ranks[i].tierName == tierName) {
          return ranks[i];
        }
      }
      return null;
    }

    function toColor(color) {
      return '#' + color.slice(0, 6);
    }

    function render() {
      var shown = [];
      for (var i = 0; i < divisions.length; i++) {
        if (divisions[i].toLowerCase().includes(search)) {
          shown.push(divisions[i]);
        }
      }

      var showRadiant = false;
      if (radiant != null && 'radiant'.includes(search)) {
        showRadiant = true;
      }

      if (shown.length == 0 && showRadiant == false) {
        elParent.innerHTML = `<h3 class="text-center text-body-secondary py-5">Search not found</h3>`;
        return;
      }

      var grid = `<thead><tr><th></th>`;
      for (var d = 0; d < shown.length; d++) {
        var division = shown[d];
        var color = toColor(getRank(division + ' 1').color);

        grid += `<th class="fw-normal" style="color: `+color+`;">`+division+`</th>`;
      }
      grid += `</tr></thead><tbody>`;

      for (var l = 0; l < levels.length; l++) {
        var level = levels[l];
        grid += `<tr><td class="text-body-secondary fs-4">`+level+`</td>`;

        for (var d = 0; d < shown.length; d++) {
          var rank = getRank(shown[d] + ' ' + level);
          var name = rank.tierName;
          var icon = rank.largeIcon;

          grid += `<td><img class="hover-lift shadow-none" src="`+icon+`" alt="`+name+`" title="`+name+`" width="105"></td>`;
        }
        grid += `</tr>`;
      }
      grid += `</tbody>`;

      var gridColumn = '';
      if (shown.length > 0) {
        var gridSize = 'col-12';
        if (showRadiant) {
          gridSize = 'col-12 col-xxl-10';
        }
        gridColumn = `
          <div class="`+gridSize+` table-responsive">
            <table class="table table-borderless text-center align-middle mb-0" style="--bs-table-bg: transparent;">`+grid+`</table>
          </div>
        `;
      }

      var radiantColumn = '';
      if (showRadiant) {
        var radiantName = radiant.tierName;
        var radiantIcon = radiant.largeIcon;
        var radiantColor = toColor(radiant.color);

        radiantColumn = `
          <div class="col-6 col-md-3 col-xxl-2 mx-auto text-center">
            <img class="img-fluid w-100 mb-2 hover-lift shadow-none" src="`+radiantIcon+`" alt="`+radiantName+`">
            <h3 class="m-0" style="color: `+radiantColor+`;">`+radiantName+`</h3>
          </div>
        `;
      }

      elParent.innerHTML = `
        <div class="bg-dark bg-opacity-50 border border-danger border-3 rounded-4 shadow-lg p-4">
          <div class="row align-items-center g-4">
            `+gridColumn+`
            `+radiantColumn+`
          </div>
        </div>
      `;
    }

    function searchItems() {
      search = elSearch.value.trim().toLowerCase();
      render();
    }

    getTiers();
  </script>
</body>

</html>
