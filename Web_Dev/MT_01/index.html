<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .bg-text { font-size: 17vw; line-height: 1; }
    .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
    .hover-lift:hover, .hover-lift:focus-within { transform: translateY(-.25rem); box-shadow: var(--bs-box-shadow-lg); }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <div class="bg-text position-fixed top-50 start-50 translate-middle mt-4 text-danger text-nowrap opacity-25 pe-none user-select-none z-n1">VALORANT</div>
  <img class="position-fixed bottom-0 start-0 m-4 pe-none z-n1" src="assets/riot-logo.png" alt="Riot Games" width="130">

  <nav class="navbar sticky-top border-bottom border-danger border-2" style="background-color: #151c28;">
    <div class="container">
      <a class="navbar-brand fs-3 text-danger" href="index.html">VALOGALL</a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: max(1320px, 178vh - 270px);">
    <div id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elLoader = document.getElementById("loader");

    var rows = [
      [
        { name: 'Agents', link: 'agents.html', color: 'primary', fit: 'cover', image: '' },
        { name: 'Maps', link: 'maps.html', color: 'secondary', fit: 'cover', image: '' },
        { name: 'Guns', link: 'guns.html', color: 'danger', fit: 'contain', image: '' }
      ],
      [
        { name: 'Skins', link: 'skins.html', color: 'info', fit: 'contain', image: '' },
        { name: 'Sprays', link: 'sprays.html', color: 'success', fit: 'contain', image: '' }
      ],
      [
        { name: 'Tiers', link: 'tiers.html', color: 'warning', fit: 'contain', image: '' }
      ]
    ];

    const getImages = async () => {
      try {
        const response1 = await fetch('https://valorant-api.com/v1/agents/add6443a-41bd-e414-f6ad-e58d267f4e95');
        const json1 = await response1.json();
        var agent = json1.data;

        const response2 = await fetch('https://valorant-api.com/v1/maps');
        const json2 = await response2.json();
        var maps = json2.data;

        const response3 = await fetch('https://valorant-api.com/v1/weapons/9c82e19d-4575-0200-1a81-3eacf00cf872');
        const json3 = await response3.json();
        var vandal = json3.data;

        const response4 = await fetch('https://valorant-api.com/v1/sprays/a44ca875-40c6-a0ee-7bb4-ca8d0fa0da2c');
        const json4 = await response4.json();
        var spray = json4.data;

        const response5 = await fetch('https://valorant-api.com/v1/competitivetiers');
        const json5 = await response5.json();
        var tiers = json5.data;

        var ascent = maps[0];
        for (var i = 0; i < maps.length; i++) {
          if (maps[i].displayName == 'Ascent') {
            ascent = maps[i];
          }
        }

        var primeVandal = vandal.skins[0];
        for (var i = 0; i < vandal.skins.length; i++) {
          if (vandal.skins[i].displayName == 'Prime Vandal') {
            primeVandal = vandal.skins[i];
          }
        }

        var latestTiers = tiers[tiers.length - 1].tiers;
        var radiant = latestTiers[latestTiers.length - 1];

        rows[0][0].image = agent.bustPortrait;
        rows[0][1].image = ascent.splash;
        rows[0][2].image = vandal.displayIcon;
        rows[1][0].image = primeVandal.chromas[0].fullRender;
        rows[1][1].image = spray.fullTransparentIcon;
        rows[2][0].image = radiant.largeIcon;

        render();
      } catch (error) {
        elParent.innerHTML = `<div class="alert alert-danger text-center">Failed to load data. Please check your connection and try again.</div>`;
      }
      elLoader.classList.add('d-none');
    }

    function render() {
      var html = '';

      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        var rowHtml = '';

        for (var t = 0; t < row.length; t++) {
          var tile = row[t];

          var name = tile.name;
          var link = tile.link;
          var color = tile.color;
          var image = tile.image;
          var fit = tile.fit;

          var padding = 'p-0';
          if (fit == 'contain') {
            padding = 'pt-3 pb-5 px-5';
          }

          rowHtml += `
            <div class="col-12 col-md-4">
              <div class="card hover-lift bg-dark border-0 rounded-4 shadow-lg overflow-hidden"
                style="background-image: linear-gradient(135deg, rgba(var(--bs-`+color+`-rgb), .55), rgba(var(--bs-`+color+`-rgb), .1));">
                <div class="ratio ratio-16x9">
                  <img class="object-fit-`+fit+` `+padding+`" src="`+image+`" alt="`+name+`">
                </div>
                <div class="card-img-overlay d-flex align-items-end">
                  <a href="`+link+`" class="stretched-link link-light text-decoration-none">
                    <h2 class="m-0 border-start border-4 border-light ps-3">`+name+`</h2>
                  </a>
                </div>
              </div>
            </div>
          `;
        }

        html += `<div class="row justify-content-center g-4 mb-4">` + rowHtml + `</div>`;
      }

      elParent.innerHTML = html;
    }

    getImages();
  </script>
</body>

</html>
