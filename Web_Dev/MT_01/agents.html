<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall | Agents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
    .hover-lift:hover, .hover-lift:focus-within { transform: translateY(-.25rem); box-shadow: var(--bs-box-shadow-lg); }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <nav class="navbar bg-danger sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fs-3 text-white" href="index.html">VALOGALL</a>
      <input id="search" class="form-control rounded-pill w-auto" type="search" placeholder="Search agents" oninput="searchItems()">
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3" title="Back to home">
          <i class="bi bi-arrow-left"></i> Back
        </a>
        <span class="badge text-bg-danger rounded-pill fs-5 px-4 py-2">Agents</span>
      </div>
      <div class="dropdown">
        <button class="btn btn-link text-white text-decoration-none fs-3 p-0" data-bs-toggle="dropdown">
          <small id="filterLabel" class="fs-6 me-1">All</small>
          <i class="bi bi-filter-right"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" id="filterMenu"></ul>
      </div>
    </div>

    <div class="row g-4" id="parent"></div>

    <nav class="d-flex justify-content-center mt-5" aria-label="Agents pages">
      <ul class="pagination" id="pagination"></ul>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elPagination = document.getElementById("pagination");
    var elFilterMenu = document.getElementById("filterMenu");
    var elFilterLabel = document.getElementById("filterLabel");
    var elSearch = document.getElementById("search");
    var elLoader = document.getElementById("loader");

    var agents = [];
    var roles = ['All'];
    var selectedRole = 'All';
    var search = '';
    var page = 1;
    var perPage = 9;

    const getAgents = async () => {
      try {
        const response = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true');
        const json = await response.json();
        agents = json.data;

        for (var i = 0; i < agents.length; i++) {
          var role = agents[i].role.displayName;
          if (roles.includes(role) == false) {
            roles.push(role);
          }
        }

        renderFilter();
        render();
      } catch (error) {
        elParent.innerHTML = `<div class="col-12"><div class="alert alert-danger text-center">Failed to load agents. Please check your connection and try again.</div></div>`;
      }
      elLoader.classList.add('d-none');
    }

    function render() {
      var list = [];
      for (var i = 0; i < agents.length; i++) {
        var name = agents[i].displayName.toLowerCase();
        var role = agents[i].role.displayName;

        if ((selectedRole == 'All' || role == selectedRole) && name.includes(search)) {
          list.push(agents[i]);
        }
      }

      if (list.length == 0) {
        elParent.innerHTML = `<h3 class="text-center text-body-secondary py-5">Search not found</h3>`;
        elPagination.innerHTML = '';
        return;
      }

      var totalPages = Math.ceil(list.length / perPage);
      var start = (page - 1) * perPage;
      var end = start + perPage;
      if (end > list.length) {
        end = list.length;
      }

      var html = '';
      for (var i = start; i < end; i++) {
        var agent = list[i];

        var name = agent.displayName;
        var image = agent.displayIcon;
        var role = agent.role.displayName;
        var roleIcon = agent.role.displayIcon;
        var color1 = '#' + agent.backgroundGradientColors[0];
        var color2 = '#' + agent.backgroundGradientColors[1];

        html += `
          <div class="col-6 col-md-4">
            <div class="card hover-lift h-100 border-0 text-center rounded-4 shadow-lg overflow-hidden"
              style="background: linear-gradient(160deg, `+color1+`, `+color2+`);">
              <img class="card-img-top p-3" src="`+image+`" alt="`+name+`">
              <div class="card-body pt-0">
                <h4 class="card-title text-white mb-1">`+name+`</h4>
                <span class="badge text-bg-dark rounded-pill">
                  <img src="`+roleIcon+`" alt="" width="14" class="me-1">`+role+`
                </span>
              </div>
            </div>
          </div>
        `;
      }
      elParent.innerHTML = html;
      renderPagination(totalPages);
    }

    function renderFilter() {
      var html = '';
      for (var i = 0; i < roles.length; i++) {
        var role = roles[i];

        var active = '';
        if (role == selectedRole) {
          active = 'active';
        }

        html += `<li><a class="dropdown-item `+active+`" href="#" onclick="setFilter('`+role+`'); return false;">`+role+`</a></li>`;
      }
      elFilterMenu.innerHTML = html;
      elFilterLabel.innerHTML = selectedRole;
    }

    function renderPagination(totalPages) {
      var html = pageItem('Previous', page - 1, page == 1, false);

      for (var i = 1; i <= totalPages; i++) {
        if (i == 1 || i == totalPages || (i >= page - 1 && i <= page + 1)) {
          html += pageItem(i, i, false, i == page);
        } else if (i == page - 2 || i == page + 2) {
          html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }
      }

      html += pageItem('Next', page + 1, page == totalPages, false);
      elPagination.innerHTML = html;
    }

    function pageItem(label, target, disabled, active) {
      var classes = 'page-item';
      if (disabled) {
        classes += ' disabled';
      }
      if (active) {
        classes += ' active';
      }

      return `<li class="`+classes+`"><a class="page-link" href="#" onclick="goToPage(`+target+`); return false;">`+label+`</a></li>`;
    }

    function goToPage(target) {
      page = target;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setFilter(role) {
      selectedRole = role;
      page = 1;
      renderFilter();
      render();
    }

    function searchItems() {
      search = elSearch.value.trim().toLowerCase();
      page = 1;
      render();
    }

    getAgents();
  </script>
</body>

</html>
