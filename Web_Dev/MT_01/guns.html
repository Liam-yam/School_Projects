<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall | Guns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .bg-text { font-size: 17vw; line-height: 1; }
    .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
    .hover-lift:hover, .hover-lift:focus-within { transform: translateY(-.25rem); box-shadow: var(--bs-box-shadow-lg); }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <div class="bg-text position-fixed top-50 start-50 translate-middle mt-4 text-danger text-nowrap opacity-25 pe-none user-select-none z-n1">VALORANT</div>
  <img class="position-fixed bottom-0 start-0 m-4 pe-none z-n1" src="assets/riot-logo.png" alt="Riot Games" width="130">

  <nav class="navbar sticky-top border-bottom border-danger border-2" style="background-color: #151c28;">
    <div class="container">
      <a class="navbar-brand fs-3 text-danger" href="index.html">VALOGALL</a>
      <input id="search" class="form-control rounded-pill w-auto" type="search" placeholder="Search guns" oninput="searchItems()">
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3" title="Back to home">
          <i class="bi bi-arrow-left"></i> Back
        </a>
        <span class="badge text-bg-danger rounded-pill fs-5 px-4 py-2">Guns</span>
      </div>
      <div class="dropdown">
        <button class="btn btn-link text-white text-decoration-none fs-3 p-0" data-bs-toggle="dropdown">
          <small id="filterLabel" class="fs-6 me-1">All</small>
          <i class="bi bi-filter-right"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" id="filterMenu"></ul>
      </div>
    </div>

    <div class="row g-4" id="parent"></div>

    <nav class="d-flex justify-content-center mt-5" aria-label="Guns pages">
      <ul class="pagination" id="pagination"></ul>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elPagination = document.getElementById("pagination");
    var elFilterMenu = document.getElementById("filterMenu");
    var elFilterLabel = document.getElementById("filterLabel");
    var elSearch = document.getElementById("search");
    var elLoader = document.getElementById("loader");

    var guns = [];
    var types = ['Sidearm', 'SMG', 'Shotgun', 'Rifle', 'Sniper', 'Heavy', 'Melee'];
    var categories = ['All'];
    var selectedCategory = 'All';
    var search = '';
    var page = 1;
    var perPage = 7;

    const getGuns = async () => {
      try {
        const response = await fetch('https://valorant-api.com/v1/weapons');
        const json = await response.json();
        var data = json.data;

        for (var t = 0; t < types.length; t++) {
          var type = types[t];

          for (var i = 0; i < data.length; i++) {
            if (data[i].category == 'EEquippableCategory::' + type) {
              data[i].type = type;
              guns.push(data[i]);

              if (categories.includes(type) == false) {
                categories.push(type);
              }
            }
          }
        }

        renderFilter();
        render();
      } catch (error) {
        elParent.innerHTML = `<div class="col-12"><div class="alert alert-danger text-center">Failed to load guns. Please check your connection and try again.</div></div>`;
      }
      elLoader.classList.add('d-none');
    }

    function render() {
      var list = [];
      for (var i = 0; i < guns.length; i++) {
        var name = guns[i].displayName.toLowerCase();
        var type = guns[i].type;

        if ((selectedCategory == 'All' || type == selectedCategory) && name.includes(search)) {
          list.push(guns[i]);
        }
      }

      if (list.length == 0) {
        elParent.innerHTML = `<h3 class="text-center text-body-secondary py-5">Search not found</h3>`;
        elPagination.innerHTML = '';
        return;
      }

      var totalPages = Math.ceil(list.length / perPage);
      var start = (page - 1) * perPage;
      var end = start + perPage;
      if (end > list.length) {
        end = list.length;
      }

      var html = '';
      for (var i = start; i < end; i++) {
        var gun = list[i];

        var name = gun.displayName;
        var image = gun.displayIcon;
        var type = gun.type;

        var costBadge = '';
        if (gun.shopData != null) {
          var cost = gun.shopData.cost;
          costBadge = `<span class="badge rounded-pill text-bg-secondary"><i class="bi bi-coin"></i> `+cost+`</span>`;
        }

        var statsText = '';
        if (gun.weaponStats != null) {
          var fireRate = gun.weaponStats.fireRate;
          var magazine = gun.weaponStats.magazineSize;
          statsText = `
            <div class="small text-white-50 mt-2">
              <i class="bi bi-lightning-charge"></i> `+fireRate+` / sec
              <i class="bi bi-stack ms-2"></i> `+magazine+` mag
            </div>
          `;
        }

        html += `
          <div class="col-12">
            <div class="card hover-lift bg-dark bg-gradient border-0 rounded-4 shadow-lg">
              <div class="row g-0 align-items-center">
                <div class="col-md-5">
                  <div class="ratio ratio-21x9">
                    <img class="object-fit-contain p-3" src="`+image+`" alt="`+name+`">
                  </div>
                </div>
                <div class="col-md-7">
                  <div class="card-body">
                    <h3 class="card-title text-white">`+name+`</h3>
                    <span class="badge text-bg-danger rounded-pill">`+type+`</span>
                    `+costBadge+`
                    `+statsText+`
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      elParent.innerHTML = html;
      renderPagination(totalPages);
    }

    function renderFilter() {
      var html = '';
      for (var i = 0; i < categories.length; i++) {
        var category = categories[i];

        var active = '';
        if (category == selectedCategory) {
          active = 'active';
        }

        html += `<li><a class="dropdown-item `+active+`" href="#" onclick="setFilter('`+category+`'); return false;">`+category+`</a></li>`;
      }
      elFilterMenu.innerHTML = html;
      elFilterLabel.innerHTML = selectedCategory;
    }

    function renderPagination(totalPages) {
      var html = pageItem('Previous', page - 1, page == 1, false);

      for (var i = 1; i <= totalPages; i++) {
        if (i == 1 || i == totalPages || (i >= page - 1 && i <= page + 1)) {
          html += pageItem(i, i, false, i == page);
        } else if (i == page - 2 || i == page + 2) {
          html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }
      }

      html += pageItem('Next', page + 1, page == totalPages, false);
      elPagination.innerHTML = html;
    }

    function pageItem(label, target, disabled, active) {
      var classes = 'page-item';
      if (disabled) {
        classes += ' disabled';
      }
      if (active) {
        classes += ' active';
      }

      return `<li class="`+classes+`"><a class="page-link" href="#" onclick="goToPage(`+target+`); return false;">`+label+`</a></li>`;
    }

    function goToPage(target) {
      page = target;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setFilter(category) {
      selectedCategory = category;
      page = 1;
      renderFilter();
      render();
    }

    function searchItems() {
      search = elSearch.value.trim().toLowerCase();
      page = 1;
      render();
    }

    getGuns();
  </script>
</body>

</html>
