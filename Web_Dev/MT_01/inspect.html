<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valogall | Skin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet">

  <style>
    body { font-family: 'VALORANT', sans-serif; }
    .bg-text { font-size: 17vw; line-height: 1; }
    .spaced-text { letter-spacing: .4em; }
  </style>
</head>

<body class="bg-gradient min-vh-100" style="background-color: #111823;">
  <div id="loader" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-gradient z-3" style="background-color: #111823;">
    <div class="spinner-grow text-danger" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading…</span>
    </div>
  </div>

  <div class="bg-text position-fixed top-50 start-50 translate-middle mt-4 text-danger text-nowrap opacity-25 pe-none user-select-none z-n1">VALORANT</div>
  <img class="position-fixed bottom-0 start-0 m-4 pe-none z-n1" src="assets/riot-logo.png" alt="Riot Games" width="130">

  <nav class="navbar sticky-top border-bottom border-danger border-2" style="background-color: #151c28;">
    <div class="container">
      <a class="navbar-brand fs-3 text-danger" href="index.html">VALOGALL</a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a id="back" href="skins.html" class="btn btn-outline-light rounded-pill px-3" title="Back to skins">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <span class="badge text-bg-danger rounded-pill fs-5 px-4 py-2">Skins</span>
    </div>

    <div class="row g-4" id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");
    var elBack = document.getElementById("back");
    var elLoader = document.getElementById("loader");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var id = urlParams.get('id');
    var page = urlParams.get('page');
    var gun = urlParams.get('gun');
    var weapon = urlParams.get('weapon');

    if (page != null && gun != null) {
      elBack.href = 'skins.html?page=' + page + '&gun=' + gun;
    }

    var skinName = '';
    var levels = [];
    var chromas = [];
    var selectedLevel = 0;
    var selectedChroma = 0;
    var videoFailed = false;

    const getSkin = async () => {
      try {
        const response = await fetch('https://valorant-api.com/v1/weapons/skins/' + id);
        const json = await response.json();
        var skin = json.data;

        const tierResponse = await fetch('https://valorant-api.com/v1/contenttiers');
        const tierJson = await tierResponse.json();
        var tiers = tierJson.data;

        skinName = skin.displayName;

        for (var i = 0; i < skin.levels.length; i++) {
          var level = skin.levels[i];

          var type = 'Base';
          if (level.levelItem != null) {
            type = level.levelItem.split('::')[1];
          }

          if (level.streamedVideo != null) {
            levels.push({ label: 'Level ' + (i + 1), type: type, video: level.streamedVideo });
          }
        }

        for (var i = 0; i < skin.chromas.length; i++) {
          var chroma = skin.chromas[i];

          var label = 'Base';
          if (i > 0) {
            label = chroma.displayName.split('(')[1].replace(')', '');
          }

          var swatch = chroma.swatch;
          if (swatch == null) {
            swatch = chroma.fullRender;
          }

          chromas.push({ label: label, swatch: swatch, image: chroma.fullRender, video: chroma.streamedVideo });
        }

        var tierBadge = '';
        var panelStyle = '';
        for (var t = 0; t < tiers.length; t++) {
          if (tiers[t].uuid == skin.contentTierUuid) {
            var tierName = tiers[t].devName;
            var softColor = '#' + tiers[t].highlightColor;
            var solidColor = '#' + tiers[t].highlightColor.slice(0, 6);

            tierBadge = `<span class="badge text-dark rounded-pill fs-6" style="background-color: `+solidColor+`;">`+tierName+`</span>`;
            panelStyle = 'background-image: linear-gradient(135deg, ' + softColor + ', transparent);';
          }
        }

        var gunLabel = '';
        var gunBadge = '';
        if (weapon != null) {
          gunLabel = `<div class="spaced-text text-body-secondary">`+weapon+`</div>`;
          gunBadge = `<span class="badge text-bg-danger rounded-pill fs-6">`+weapon+`</span>`;
        }

        var variantsCard = '';
        if (chromas.length > 1) {
          variantsCard = `
            <div class="bg-dark bg-gradient rounded-4 shadow-lg p-4 mt-4">
              <h5 class="text-white mb-3">Color Variants</h5>
              <div class="row g-3" id="variants"></div>
            </div>
          `;
        }

        document.title = 'Valogall | ' + skinName;

        elParent.innerHTML = `
          <div class="col-lg-8">
            <div class="bg-dark bg-gradient rounded-4 shadow-lg overflow-hidden position-relative" id="player"></div>
            `+variantsCard+`
          </div>
          <div class="col-lg-4">
            <div class="bg-dark rounded-4 shadow-lg p-4 h-100" style="`+panelStyle+`">
              `+gunLabel+`
              <h1 class="display-5 text-white">`+skinName+`</h1>
              <div class="d-flex flex-wrap gap-2 mb-4">
                `+gunBadge+`
                `+tierBadge+`
              </div>
              <h5 class="text-white mb-3">Skin Levels</h5>
              <div id="levels"></div>
            </div>
          </div>
        `;

        renderAll();
      } catch (error) {
        elParent.innerHTML = `<div class="col-12"><div class="alert alert-danger text-center">Failed to load this skin. Please go back and try again.</div></div>`;
      }
      elLoader.classList.add('d-none');
    }

    function renderAll() {
      renderPlayer();
      renderLevels();
      renderVariants();
    }

    function renderPlayer() {
      var chroma = chromas[selectedChroma];
      var image = chroma.image;

      var video = chroma.video;
      if (selectedChroma == 0 && levels.length > 0) {
        video = levels[selectedLevel].video;
      }

      var html = '';
      if (video != null && videoFailed == false) {
        html = `
          <div class="ratio ratio-16x9">
            <video id="video" src="`+video+`" poster="`+image+`" controls preload="none"
              onplay="hidePlayButton()" onpause="showPlayButton()" onerror="useImage()"></video>
          </div>
          <button id="playButton" type="button" class="btn btn-danger rounded-circle position-absolute top-50 start-50 translate-middle fs-1 lh-1 p-3"
            onclick="playVideo()" aria-label="Play video"><i class="bi bi-play-fill"></i></button>
        `;
      } else {
        html = `
          <div class="ratio ratio-16x9">
            <img class="object-fit-contain p-4" src="`+image+`" alt="`+skinName+`">
          </div>
        `;
      }
      document.getElementById("player").innerHTML = html;
    }

    function renderLevels() {
      var html = '';

      for (var i = 0; i < levels.length; i++) {
        var label = levels[i].label;
        var type = levels[i].type;

        var active = '';
        if (i == selectedLevel && selectedChroma == 0) {
          active = 'active';
        }

        html += `
          <button type="button" class="btn btn-outline-danger `+active+` w-100 d-flex justify-content-between align-items-center text-start mb-2"
            onclick="setLevel(`+i+`)">
            <span>
              <small class="d-block text-white-50">`+label+`</small>
              <span class="fs-5 text-white">`+type+`</span>
            </span>
            <i class="bi bi-play-fill fs-3"></i>
          </button>
        `;
      }

      if (html == '') {
        html = `<p class="text-body-secondary mb-0">No video available for this skin.</p>`;
      }
      document.getElementById("levels").innerHTML = html;
    }

    function renderVariants() {
      var elVariants = document.getElementById("variants");
      if (elVariants == null) {
        return;
      }

      var html = '';
      for (var i = 0; i < chromas.length; i++) {
        var label = chromas[i].label;
        var swatch = chromas[i].swatch;

        var border = 'border-secondary';
        var color = 'text-white';
        if (i == selectedChroma) {
          border = 'border-danger border-2';
          color = 'text-danger';
        }

        html += `
          <div class="col-6 col-md-3">
            <button type="button" class="btn p-0 border-0 d-flex align-items-center gap-2 text-start" onclick="setChroma(`+i+`)">
              <img class="border `+border+` rounded-2" src="`+swatch+`" alt="" width="44" height="44">
              <span class="`+color+`">`+label+`</span>
            </button>
          </div>
        `;
      }
      elVariants.innerHTML = html;
    }

    function setLevel(index) {
      selectedLevel = index;
      selectedChroma = 0;
      videoFailed = false;
      renderAll();
    }

    function setChroma(index) {
      selectedChroma = index;
      videoFailed = false;
      renderAll();
    }

    function playVideo() {
      document.getElementById("video").play();
    }

    function hidePlayButton() {
      document.getElementById("playButton").classList.add('d-none');
    }

    function showPlayButton() {
      document.getElementById("playButton").classList.remove('d-none');
    }

    function useImage() {
      videoFailed = true;
      renderPlayer();
    }

    getSkin();
  </script>
</body>

</html>
